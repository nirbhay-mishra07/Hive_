<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hive — Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="delivery.css">
</head>
<body>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="logo"><img src="Hive.png" alt="" style="width:22px;height:22px;vertical-align:-4px;margin-right:6px;">Hive</div>
    <nav class="nav-icons">
      <button class="icon-btn" id="notifBtn" title="Notifications">
        <i data-lucide="bell"></i><span class="badge" id="notifBadge" hidden>0</span>
      </button>
      <button class="icon-btn" id="profileBtn" title="Profile"><i data-lucide="user-round"></i></button>
    </nav>
  </header>

  <main class="container">

    <!-- Dashboard stats -->
    <section class="stats-grid" id="statsGrid">
      <div class="stat-card glass">
        <span class="stat-label">Requests Posted</span>
        <span class="stat-value" id="statPosted">--</span>
      </div>
      <div class="stat-card glass">
        <span class="stat-label">Deliveries Completed</span>
        <span class="stat-value" id="statCompleted">--</span>
      </div>
      <div class="stat-card glass">
        <span class="stat-label">Total Earnings</span>
        <span class="stat-value" id="statEarnings">--</span>
      </div>
      <div class="stat-card glass">
        <span class="stat-label">Active Requests</span>
        <span class="stat-value" id="statActive">--</span>
      </div>
    </section>

    <!-- Feed header -->
    <section class="feed-header">
      <h2>Delivery Feed</h2>
      <button class="btn-primary" id="openNewRequestBtn">+ New Request</button>
    </section>

    <!-- Filters -->
    <section class="filters glass">
      <input type="text" id="searchInput" placeholder="Search by pickup, drop or title...">
      <select id="platformFilter">
        <option value="">All Platforms</option>
        <option value="Zomato">Zomato</option>
        <option value="Swiggy">Swiggy</option>
        <option value="Blinkit">Blinkit</option>
        <option value="Amazon">Amazon</option>
        <option value="Other">Other</option>
      </select>
      <select id="sortFilter">
        <option value="latest">Latest</option>
        <option value="nearby">Nearby</option>
        <option value="reward">Highest Reward</option>
      </select>
      <select id="genderFilter">
        <option value="">Any Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </section>

    <!-- Feed -->
    <section class="feed-grid" id="feedGrid">
      <!-- cards injected by JS -->
    </section>

    <p class="empty-state" id="emptyState" hidden>No delivery requests right now. Be the first to post one!</p>

  </main>

  <!-- New Request Modal -->
  <div class="modal-overlay" id="newRequestOverlay" hidden>
    <div class="modal glass">
      <div class="modal-header">
        <h3>New Delivery Request</h3>
        <button class="close-btn" data-close="newRequestOverlay"><i data-lucide="x"></i></button>
      </div>
      <form id="newRequestForm" class="modal-body">
        <label>Platform
          <select name="platform" required>
            <option value="">Select platform</option>
            <option value="Zomato">Zomato</option>
            <option value="Swiggy">Swiggy</option>
            <option value="Blinkit">Blinkit</option>
            <option value="Amazon">Amazon</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <label>Request Title
          <input type="text" name="title" placeholder="e.g. Pick up my Swiggy order" required>
        </label>
        <label>Pickup Location
          <input type="text" name="pickupLocation" placeholder="e.g. Main Gate" required>
        </label>
        <label>Drop Location
          <input type="text" name="dropLocation" placeholder="e.g. Hostel H4, Room 212" required>
        </label>
        <label>Reward (₹)
          <input type="number" name="reward" min="0" placeholder="e.g. 30" required>
        </label>
        <label>Estimated Delivery Time
          <input type="text" name="estimatedTime" placeholder="e.g. 20 mins">
        </label>
        <label>Preferred Delivery Gender
          <select name="preferredGender">
            <option value="">No preference</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </label>
        <label>Additional Instructions
          <textarea name="instructions" rows="2" placeholder="Optional notes..."></textarea>
        </label>
        <div class="location-status" id="locationStatus"><i data-lucide="map-pin"></i> Fetching your location...</div>
        <button type="submit" class="btn-primary full-width">Post Request</button>
      </form>
    </div>
  </div>

  <!-- Order Details Modal -->
  <div class="modal-overlay" id="orderDetailsOverlay" hidden>
    <div class="modal glass">
      <div class="modal-header">
        <h3 id="orderDetailsTitle">Order Details</h3>
        <button class="close-btn" data-close="orderDetailsOverlay"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body" id="orderDetailsBody">
        <!-- injected by JS -->
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="api.js"></script>
  <script src="delivery.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
